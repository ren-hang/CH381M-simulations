<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CH 381M Interactive Simulations</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --muted: #5a5f73;
    --accent: #2f5bd9;
    --accent-hover: #1e44b0;
    --border: #e1e4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161f;
      --card-bg: #1d1f2b;
      --text: #eef0f6;
      --muted: #a3a7bd;
      --accent: #7fa0ff;
      --accent-hover: #a9c0ff;
      --border: #2c2f40;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 2rem 1rem 3rem;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 2rem;
  }
  .course-tag {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    margin-bottom: 0.75rem;
  }
  h1 {
    font-size: 1.9rem;
    margin: 0 0 0.5rem;
  }
  p.lead {
    color: var(--muted);
    margin: 0;
    font-size: 1rem;
  }
  .grid {
    display: grid;
    gap: 1rem;
    grid-template-columns: 1fr;
  }
  @media (min-width: 560px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }
  a.card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  a.card h2 {
    margin: 0 0 0.35rem;
    font-size: 1.1rem;
    color: var(--accent);
  }
  a.card:hover h2 {
    color: var(--accent-hover);
  }
  a.card p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
  }
  footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="course-tag">CH 381M &middot; Advanced Analytical Chemistry</span>
      <h1>CH 381M Interactive Simulations</h1>
      <p class="lead">Interactive simulations for CH 381M Advanced Analytical Chemistry.</p>
    </header>

    <div class="grid">
      <a class="card" href="./lockin/">
        <h2>Lock-in Detection Simulator</h2>
        <p>Explore lock-in amplifier signal detection interactively.</p>
      </a>
    </div>

    <footer>
      CH 381M &middot; Advanced Analytical Chemistry
    </footer>
  </div>
</body>
</html>
